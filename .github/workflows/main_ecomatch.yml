name: Build and deploy PHP app to Azure Web App - EcoMatch

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # Cambiado a 8.3 que es estable (8.5 da errores en GitHub)
          coverage: none # Acelera la instalación

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Run composer install
        working-directory: EcoMatch
        run: composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache NPM
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install NPM dependencies
        working-directory: EcoMatch
        run: npm ci # Mucho más rápido y seguro que npm install

      - name: Build frontend assets
        working-directory: EcoMatch
        run: npm run build

      # NUEVO: Preparar el paquete SIN node_modules para que Azure lo reciba ligero
      - name: Prepare deployment artifact
        working-directory: EcoMatch
        run: |
          mkdir -p ../deploy_package
          rsync -av --exclude='node_modules' --exclude='.git' --exclude='.env' ./ ../deploy_package/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: deploy_package 

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app
      
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'EcoMatch'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_569816F252874325AD6A7889DE5D104E }}
